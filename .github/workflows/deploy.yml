name: Build and deploy to production

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:    # manual trigger from the Actions tab

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # don't kill mid-deploy if a second push comes in

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Bumped after dropping a chunk of workspace deps — restore-keys
          # was pulling in a stale target/ from the previous tree.
          prefix-key: "v2-native"
          # Save the cache even when later steps fail, otherwise iterating
          # on the deploy step (which is failing on Cloudflare Access right
          # now) keeps blowing the build cache and we rebuild ~250 crates
          # from scratch on every run.
          cache-on-failure: true
      - name: cargo test --workspace
        run: cargo test --workspace --quiet

  deploy:
    name: Build & deploy to LXC
    needs: test
    # Pin to ubuntu-22.04 so the binary's glibc baseline (2.35) stays
    # compatible with Debian 13 (glibc 2.41 — backward-compatible). If we
    # let GitHub bump `ubuntu-latest` past Debian, deploy silently breaks.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-native"

      - name: Build release binary
        run: |
          cargo build --release --bin alert-bot
          strip target/release/alert-bot
          ls -lh target/release/alert-bot

      - name: Install cloudflared
        run: |
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LXC_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Sanity-check Cloudflare Access creds
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ vars.SSH_HOST }}
        run: |
          echo "Hostname: $SSH_HOST"
          echo "CF_ID length: ${#CF_ID}    (looks like X.access if ends with '.access')"
          echo "CF_ID ends with: ...${CF_ID: -8}"
          echo "CF_SECRET length: ${#CF_SECRET}"
          # Hit the protected hostname with the service token via curl.
          # 200 = creds + policy good. 403 = creds wrong or policy denies.
          # Anything else = routing/tunnel problem.
          code=$(curl -s -o /tmp/cf_body -w "%{http_code}" \
               -H "CF-Access-Client-Id: $CF_ID" \
               -H "CF-Access-Client-Secret: $CF_SECRET" \
               "https://$SSH_HOST/" || true)
          echo "HTTP status: $code"
          head -c 500 /tmp/cf_body || true
          echo
          if [ "$code" != "200" ] && [ "$code" != "404" ] && [ "$code" != "426" ]; then
            echo "::error::Cloudflare Access rejected the service token (status $code)"
            exit 1
          fi

      - name: scp binary + install + restart on the LXC
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          # Pass service token as CLI flags rather than env vars — env var
          # names have shifted across cloudflared releases (TUNNEL_*,
          # CLOUDFLARED_*, CLOUDFLARE_*) and the flag form is stable.
          PROXY="cloudflared access ssh --hostname $SSH_HOST --service-token-id $CF_ID --service-token-secret $CF_SECRET"

          scp -o "ProxyCommand=$PROXY" \
              -o "StrictHostKeyChecking=accept-new" \
              -o "UserKnownHostsFile=/dev/null" \
              target/release/alert-bot \
              "$SSH_USER@$SSH_HOST:/tmp/alert-bot.new"

          ssh -o "ProxyCommand=$PROXY" \
              -o "StrictHostKeyChecking=accept-new" \
              -o "UserKnownHostsFile=/dev/null" \
              "$SSH_USER@$SSH_HOST" bash <<'REMOTE'
          set -euo pipefail
          install -m 0755 -o root -g root /tmp/alert-bot.new /usr/local/bin/alert-bot
          rm -f /tmp/alert-bot.new
          systemctl restart alert-bot
          systemctl is-active alert-bot
          REMOTE

      - name: Tail logs briefly
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          PROXY="cloudflared access ssh --hostname $SSH_HOST --service-token-id $CF_ID --service-token-secret $CF_SECRET"
          ssh -o "ProxyCommand=$PROXY" \
              -o "StrictHostKeyChecking=accept-new" \
              -o "UserKnownHostsFile=/dev/null" \
              "$SSH_USER@$SSH_HOST" \
              "timeout 20 journalctl -u alert-bot -n 30 -f || true"
