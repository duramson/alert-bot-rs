name: Build and deploy to production

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:    # manual trigger from the Actions tab

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # don't kill mid-deploy if a second push comes in

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Bumped after dropping a chunk of workspace deps — restore-keys
          # was pulling in a stale target/ from the previous tree.
          prefix-key: "v2-native"
      - name: cargo test --workspace
        run: cargo test --workspace --quiet

  deploy:
    name: Build & deploy to LXC
    needs: test
    # Pin to ubuntu-22.04 so the binary's glibc baseline (2.35) stays
    # compatible with Debian 13 (glibc 2.41 — backward-compatible). If we
    # let GitHub bump `ubuntu-latest` past Debian, deploy silently breaks.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-native"

      - name: Build release binary
        run: |
          cargo build --release --bin alert-bot
          strip target/release/alert-bot
          ls -lh target/release/alert-bot

      - name: Install cloudflared
        run: |
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LXC_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: scp binary + install + restart on the LXC
        env:
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          # Push straight from the runner to the LXC over the same
          # Cloudflare Access SSH proxy. No GitHub Release roundtrip — keeps
          # the repo free to stay private.
          scp -o "ProxyCommand=cloudflared access ssh --hostname $SSH_HOST" \
              -o "StrictHostKeyChecking=accept-new" \
              -o "UserKnownHostsFile=/dev/null" \
              target/release/alert-bot \
              "$SSH_USER@$SSH_HOST:/tmp/alert-bot.new"

          ssh -o "ProxyCommand=cloudflared access ssh --hostname $SSH_HOST" \
              -o "StrictHostKeyChecking=accept-new" \
              -o "UserKnownHostsFile=/dev/null" \
              "$SSH_USER@$SSH_HOST" bash <<'REMOTE'
          set -euo pipefail
          install -m 0755 -o root -g root /tmp/alert-bot.new /usr/local/bin/alert-bot
          rm -f /tmp/alert-bot.new
          systemctl restart alert-bot
          systemctl is-active alert-bot
          REMOTE

      - name: Tail logs briefly
        env:
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          ssh -o "ProxyCommand=cloudflared access ssh --hostname $SSH_HOST" \
              -o "StrictHostKeyChecking=accept-new" \
              -o "UserKnownHostsFile=/dev/null" \
              "$SSH_USER@$SSH_HOST" \
              "timeout 20 journalctl -u alert-bot -n 30 -f || true"
