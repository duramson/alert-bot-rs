# Production override: pull bot image from ghcr.io instead of building locally.
#
# Used together with docker-compose.yml on hosts that consume CI-built images.
# Activate by setting `COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml`
# in the LXC's `.env` (compose reads it automatically), so plain
# `docker compose pull / up / down` Just Works™ without -f flags.
#
# Local dev keeps using docker-compose.yml on its own (build from source).
services:
  bot:
    image: ghcr.io/duramson/alert-bot-rs:latest
    pull_policy: always
    # Drop the build directive so `docker compose pull` actually pulls from
    # the registry rather than triggering a local rebuild.
    build: !reset null
