# The bot exposes :8080 on the host network so an external Cloudflare Tunnel
# (or any reverse proxy) can reach it. Postgres stays on the internal compose
# network — never exposed.
#
# For local dev without a public endpoint: leave WEBHOOK_URL empty in `.env`
# and the bot falls back to long-polling.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alertbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-alertbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [alertbot]

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-alertbot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alertbot}
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN must be set}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_LISTEN: 0.0.0.0:8080
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
      RUST_LOG: ${RUST_LOG:-info,alert_bot=debug}
    ports:
      # Reachable on the LXC's host network for an external cloudflared.
      # If you run cloudflared in the same compose, drop this and add a
      # service that talks to bot:8080 over the internal network.
      - "8080:8080"
    networks: [alertbot]

volumes:
  postgres_data:

networks:
  alertbot:
