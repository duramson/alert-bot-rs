[workspace]
resolver = "2"
members = [
    "crates/parser",
    "crates/core",
    "crates/storage",
    "crates/bot",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Telegram (pulls axum transitively via the `webhooks-axum` feature)
teloxide = { version = "0.17", features = ["macros", "webhooks-axum"] }

# Standalone HTTP server for the read-only /stats endpoint (Homepage widget).
# Pinned to 0.7 so it unifies with the axum teloxide's webhooks-axum already
# pulls — no duplicate axum/hyper in the tree.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }

# HTTP client we hand to teloxide explicitly so we can set tcp_keepalive and
# tighter pool_idle_timeout — defaults let pooled HTTPS conns to api.telegram.org
# go silently dead behind NAT, then the first SendMessage after idle hangs in
# Connect-TimedOut and the user has to retry.
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "macros",
    "migrate",
] }

# Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }

# Parser
strsim = "0.11"

# iCalendar RRULE — single source of truth for recurrence semantics.
# Parser builds RRules; storage serialises them as RFC-5545 strings.
rrule = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
thiserror = "2"
anyhow = "1"

# Serde (used by core for enum derives + chrono/chrono-tz feature flags)
serde = { version = "1", features = ["derive"] }

# Misc
dotenvy = "0.15"
url = "2"

# Rate limiting (in-memory token bucket per Telegram user_id).
governor = "0.10"

# Benchmarking (dev-only)
criterion = "0.8"

# Internal
parser = { path = "crates/parser" }
botcore = { path = "crates/core", package = "alert-bot-core" }
storage = { path = "crates/storage", package = "alert-bot-storage" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
