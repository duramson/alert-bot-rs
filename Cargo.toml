[workspace]
resolver = "2"
members = [
    "crates/parser",
    "crates/core",
    "crates/storage",
    "crates/bot",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Telegram
teloxide = { version = "0.13", features = ["macros", "webhooks-axum"] }

# Web framework (used by teloxide webhook)
axum = "0.7"

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "macros",
    "migrate",
] }

# Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }

# Parser
strsim = "0.11"

# Rate limiting
governor = "0.7"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
thiserror = "2"
anyhow = "1"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Misc
dotenvy = "0.15"
once_cell = "1"
url = "2"

# Internal
parser = { path = "crates/parser" }
botcore = { path = "crates/core", package = "alert-bot-core" }
storage = { path = "crates/storage", package = "alert-bot-storage" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
